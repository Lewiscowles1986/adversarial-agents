[project]
name = "adversarial-agents"
version = "0.1.0"
description = "Experiment with adversarial agents"
authors = [
    {name = "Lewis Cowles"}
]
dependencies = []
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mutmut>=3.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "adversarial-agents"
version = "0.1.0"
description = "Experiment with adversarial agents"
authors = ["Lewis Cowles"]
packages = [{include = "*.py"}, {include = "test"}]

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
mutmut = "^3.0.0"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.mutmut]
paths_to_mutate = ["hooks.py", "llm_interface.py", "llm_wrapper.py", "orchestrator.py"]
backup = false
runner = "pytest"
tests_dir = ["test/"]
dict_synonyms = ["Struct", "Data"]
use_setproctitle = false
